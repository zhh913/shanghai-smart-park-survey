'use strict';
const D=JSON.parse(document.getElementById('dataset').textContent), ALL=D.groups['全部样本'];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('zh-CN'), pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'—', rate=(n,d)=>d?100*n/d:null;
const score={'非常满意':5,'满意':4,'一般':3,'不满意':2,'非常不满意':1};
const order={1:['18岁以下','18~30岁','31~45岁','46~60岁','60岁以上'],2:['男','女'],10:['非常满意','满意','一般','不满意','非常不满意']};
let district='全部样本',sex='全部性别',age='全部年龄',tab='overview',parkQuery='',textQuery='',topic='全部',satisfactionText='全部',textLimit=30;
const selectedGroup=(d=district)=>D.cohorts[[d,sex,age].join('|')];
const groupView=()=>Object.fromEntries(Object.keys(D.groups).map(d=>[d,selectedGroup(d)]));
const filterLabel=()=>[district==='全部样本'?'全部行政区':district,sex,age].join(' · ');
const isFiltered=()=>district!=='全部样本'||sex!=='全部性别'||age!=='全部年龄';
const questionType=q=>[1,2,10].includes(+q)?'单选题':[3,13].includes(+q)?'填空题':'多选题';
const Q=(g,q)=>g.q[q], count=(g,q,k)=>Q(g,q).counts[k]||0, sat=g=>count(g,10,'非常满意')+count(g,10,'满意');
const mean=g=>Q(g,10).n?Object.entries(Q(g,10).counts).reduce((a,[k,n])=>a+score[k]*n,0)/Q(g,10).n:null;
const keys=q=>order[q]||Object.keys(Q(ALL,q).counts).sort((a,b)=>count(ALL,q,b)-count(ALL,q,a));
const rankOptions=(g,q,exclude=[])=>Object.entries(Q(g,q).counts).filter(([k])=>!exclude.includes(k)).sort((a,b)=>b[1]-a[1]);
const legend=()=>'<div class="legend"><i></i>当前范围选择率<i class="ref"></i>全部 3,810 份样本选择率（不随筛选改变） · 0–100%</div>';
function bars(g,q){const a=Q(g,q),total=Q(ALL,q);return keys(q).map(k=>{const n=a.counts[k]||0,p=a.n?100*n/a.n:0,b=total.n?100*(total.counts[k]||0)/total.n:0;return `<div class="barrow"><div class="barhead"><span class="barlabel">${esc(k)}</span><span class="barvalue">${fmt(n)} 人 <small>${pct(n,a.n)}</small></span></div><div class="track" role="img" aria-label="${esc(k)}：${n} 人，${pct(n,a.n)}；全部样本 ${pct(total.counts[k]||0,total.n)}"><div class="fill" style="width:${p}%"></div>${isFiltered()?`<span class="marker" style="left:${b}%"></span>`:''}</div></div>`}).join('');}
function qnote(g,q){const x=Q(g,q);return `<div class="caption">${[1,2,10].includes(q)?'单选题':'多选题'} · 有效答题 ${fmt(x.n)} 人 · 缺失 ${fmt(g.n-x.n)} 人${![1,2,10].includes(q)?'；比例以本题有效答题人数为分母，合计可超过 100%。':''}</div>${x.conflict?`<div class="note">${x.conflict} 份答卷同时选择了“${q===11?'暂无新增需求':'未见过/使用过'}”和其他选项。此处保留原答，不将这些选项视为互斥。</div>`:''}`;}
function panel(g,q,title){return `<section class="panel"><h2>${title} <span class="question-type">${questionType(q)}</span></h2><p class="caption">${esc(D.titles[q])}</p>${!isFiltered()?'<div class="legend">条形长度：选择率，统一 0–100%</div>':legend()}${bars(g,q)}${qnote(g,q)}</section>`;}
function metrics(g){const m=mean(g);return `<div class="metrics"><div class="metric"><div class="label">当前范围 · ${esc(district)}</div><div class="value">${fmt(g.n)}<span class="unit">份</span></div><div class="caption">占全部样本 ${pct(g.n,ALL.n)}</div></div><div class="metric"><div class="label">总体满意率</div><div class="value">${pct(sat(g),Q(g,10).n)}</div><div class="caption">非常满意 + 满意，共 ${fmt(sat(g))} 人</div></div><div class="metric"><div class="label">满意度均分</div><div class="value">${m===null?'—':m.toFixed(2)}<span class="unit">/ 5</span></div><div class="caption">1–5 赋分的描述性均值</div></div><div class="metric"><div class="label">公园名称待核实记录</div><div class="value">${fmt(g.guessed)}<span class="unit">份</span></div><div class="caption">“猜测公园名称”列非空</div></div></div>`;}
function caution(g){if(!g.n)return '';let notes=[];const base=selectedGroup('全部样本');if(district==='全部样本')notes.push(`当前性别与年龄条件下，浦东新区 ${fmt(selectedGroup('浦东新区').n)} 份，占 ${pct(selectedGroup('浦东新区').n,base.n)}。结果受样本区域构成影响。`);if(g.n<30)notes.push('当前筛选不足 30 份答卷，比例易受个别答卷影响，仅作描述性参考；30 份仅为提醒阈值。');if(g.guessed)notes.push(`${g.guessed} 份记录带有待核实公园名称；行政区仍按原表归属统计。`);return notes.length?`<div class="note">${notes.join(' ')}</div>`:'';}
function insights(g){if(!g.n)return '';const a=rankOptions(g,1)[0],need=rankOptions(g,11,['其他','暂无新增需求'])[0],robot=rankOptions(g,12,['其他'])[0];let t=[`年龄组中，${a[0]}人数最多，为 ${fmt(a[1])} 人（${pct(a[1],Q(g,1).n)}）。`];if(need)t.push(`新增设施需求中，“${need[0]}”选择人数${rankOptions(g,11,['其他','暂无新增需求']).filter(x=>x[1]===need[1]).length>1?'并列':''}最多，为 ${fmt(need[1])} 人（${pct(need[1],Q(g,11).n)}）。`);if(robot)t.push(`机器人功能中，“${robot[0]}”选择人数${rankOptions(g,12,['其他']).filter(x=>x[1]===robot[1]).length>1?'并列':''}最多，为 ${fmt(robot[1])} 人（${pct(robot[1],Q(g,12).n)}）。`);return `<div class="insight"><h3>当前样本的主要发现</h3><ul>${t.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;}
function parks(g){const rows=g.parks.filter(([k])=>k.includes(parkQuery));return `<section class="panel"><div class="section-top"><div><h2>Q3 · 公园原填名称 <span class="question-type">填空题</span></h2><p class="caption">默认显示当前筛选范围内的全部原填名称，可用关键词查找。仅去首尾空格，同园异名未合并，条目数不代表独立公园数量。</p></div><label class="field">查找公园<input id="parkSearch" placeholder="输入原填名称" value="${esc(parkQuery)}"></label></div><div class="tablewrap"><table><thead><tr><th>名称</th><th class="num">人数</th><th class="num">占当前样本</th></tr></thead><tbody>${rows.map(([k,n])=>`<tr><td>${esc(k)}</td><td class="num">${fmt(n)}</td><td class="num">${pct(n,g.n)}</td></tr>`).join('')||'<tr><td colspan="3">未找到匹配名称</td></tr>'}</tbody></table></div><p class="caption">已显示全部 ${rows.length} 项匹配名称；当前筛选范围共有 ${g.parks.length} 项原填名称。</p></section>`;}
function overview(g){const groups=groupView(),base=groups['全部样本'],coverage=Object.entries(groups).filter(([k,v])=>k!=='全部样本'&&v.n).length;const entries=[['全部样本',base],...Object.entries(groups).filter(([k])=>k!=='全部样本').sort((a,b)=>b[1].n-a[1].n)];return `<div class="metrics"><div class="metric"><div class="label">当前组合样本量</div><div class="value">${fmt(g.n)}<span class="unit">份</span></div><div class="caption">${esc(filterLabel())}</div></div><div class="metric"><div class="label">占原始全部样本</div><div class="value">${pct(g.n,ALL.n)}</div><div class="caption">原始样本共 3,810 份</div></div><div class="metric"><div class="label">当前性别与年龄覆盖行政区</div><div class="value">${coverage}<span class="unit">个</span></div><div class="caption">含样本的行政区数量</div></div><div class="metric"><div class="label">公园名称待核实记录</div><div class="value">${fmt(g.guessed)}<span class="unit">份</span></div><div class="caption">当前筛选范围内</div></div></div>${caution(g)}<section class="panel" id="districtDistribution"><h2>行政区样本分布</h2><p class="caption">保留“${esc(sex)} / ${esc(age)}”条件，展示全部行政区的 ${fmt(base.n)} 份答卷。点击区名筛选；“全部行政区”清除行政区条件。全部行是汇总，不与各区重复相加。</p>${entries.map(([k,v])=>`<div class="barrow"><div class="barhead"><button data-district="${k}">${k==='全部样本'?'全部行政区（包含所有行政区）':k}</button>${k===district?'<span class="tag">当前</span>':''}<span class="barvalue">${fmt(v.n)} 人 <small>${pct(v.n,base.n)}</small></span></div><div class="track"><div class="fill" style="width:${base.n?v.n/base.n*100:0}%"></div></div></div>`).join('')}</section>`;}
function ageView(g){return caution(g)+panel(g,1,'Q1 · 年龄分布');}
function genderView(g){return caution(g)+panel(g,2,'Q2 · 性别分布');}
function satisfaction(g){const m=mean(g);return `<div class="metrics"><div class="metric"><div class="label">Q10 有效答题人数</div><div class="value">${fmt(Q(g,10).n)}<span class="unit">人</span></div><div class="caption">${esc(filterLabel())}</div></div><div class="metric"><div class="label">总体满意率</div><div class="value">${pct(sat(g),Q(g,10).n)}</div><div class="caption">非常满意 + 满意，共 ${fmt(sat(g))} 人</div></div><div class="metric"><div class="label">满意度均分</div><div class="value">${m===null?'—':m.toFixed(2)}<span class="unit">/ 5</span></div><div class="caption">1–5 赋分的描述性均值</div></div><div class="metric"><div class="label">不满意及非常不满意</div><div class="value">${pct(count(g,10,'不满意')+count(g,10,'非常不满意'),Q(g,10).n)}</div><div class="caption">${fmt(count(g,10,'不满意')+count(g,10,'非常不满意'))} 人</div></div></div>${caution(g)}${panel(g,10,'Q10 · 总体满意度')}`;}
function facilities(g){return caution(g)+`<div class="section-top"><div><h2>设施接触情况</h2><p class="muted">题目合并询问“见过 / 使用过”，结果表示报告接触情况，不能解释为实际使用率或设施客观覆盖率。</p></div></div><div class="grid">${[[4,'Q4 · 查询与导览'],[5,'Q5 · 入园与停车'],[6,'Q6 · 便民服务'],[7,'Q7 · 游园体验'],[8,'Q8 · 科普服务'],[9,'Q9 · 评价反馈与求助']].map(([q,t])=>panel(g,q,t)).join('')}</div>`;}
function needs(g){const demand=rankOptions(g,11,['其他','暂无新增需求'])[0];return caution(g)+`<div class="insight"><h3>需求的解读</h3><p>${demand?`当前人群可优先进一步了解“${esc(demand[0])}”的具体需求场景。`:'当前人群暂无具体设施需求选择。'}选择率体现答卷中的偏好，尚不能直接确定建设顺序；还需结合设施现状、成本与运维条件。</p><p class="caption">Q11 未单独设置“智慧便民服务设施”选项，不能据此认定便民设施没有新增需求。现有设施接触率与未来需求率也不宜直接相减作为供需缺口。</p></div><div class="grid">${panel(g,11,'Q11 · 新增设施与服务')}${panel(g,12,'Q12 · 机器人功能偏好')}</div>`;}
function compare(g){const dims=['智慧查询与导览设施','智慧入园与停车设施','智慧游园体验设施','智慧科普服务','智慧评价反馈与求助设施'];const districts=Object.entries(groupView()).filter(([k])=>k!=='全部样本').sort((a,b)=>b[1].n-a[1].n);return `<section class="panel"><h2>行政区横向对比</h2><p class="muted">此表按顶部性别与年龄筛选，始终显示全部行政区；行政区选择仅作“当前”标记。区内比例使用各区本题有效答题人数，不按样本量排序解释表现优劣。</p><div class="note">各区样本量差异较大，部分筛选组合可能没有样本；无样本显示“—”，不显示为 0%。小样本区不能据此作稳定排名。</div><div class="tablewrap"><table class="comparetable"><thead><tr><th>行政区</th><th class="num">样本量</th><th class="num">满意率</th><th class="num">满意度均分</th><th>选择最多的新增设施（并列均列出）</th></tr></thead><tbody>${districts.map(([k,s])=>{const t=rankOptions(s,11,['其他','暂无新增需求']),best=t.filter(x=>t[0]&&x[1]===t[0][1]);return `<tr><td><button data-district="${k}">${k}</button>${k===district?' <span class="tag">当前</span>':''}${s.n&&s.n<30?'<span class="pill">小样本</span>':''}</td><td class="num">${fmt(s.n)}</td><td class="num">${pct(sat(s),Q(s,10).n)}</td><td class="num">${mean(s)?.toFixed(2)||'—'}</td><td>${best.length?best.map(([o,n])=>`${esc(o)}（${pct(n,Q(s,11).n)}）`).join('<br>'):'—'}</td></tr>`}).join('')}</tbody></table></div><h3 style="margin-top:28px">新增设施需求选择率</h3><p class="caption">颜色越深表示区内选择率越高；格内同时保留数值。多选题，各列不可相加为 100%。</p><div class="tablewrap"><table><thead><tr><th>行政区</th>${dims.map(x=>`<th class="num">${x.replace('智慧','').replace('设施','')}</th>`).join('')}</tr></thead><tbody>${districts.map(([k,s])=>`<tr><td>${k}（n=${s.n}）</td>${dims.map(x=>`<td class="num"><span class="heat" style="background:rgba(33,119,93,${s.n?0.04+0.3*count(s,11,x)/Q(s,11).n:0})">${pct(count(s,11,x),Q(s,11).n)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;}
const satisfactionKinds=['正向评价','不满意表达','其他满意相关'];
function satisfactionTextKind(text){
 const t=text.replace(/\s/g,'');
 const negative=/不(?:太|够|怎么|是很|很|算|大|甚|尽)?满意|谈不上满意|难以满意|无法满意|没(?:有)?(?:很)?满意|不满(?!足)/;
 const positive=/满意|非常的?好|很好|挺好|蛮好|比较好|不错|好评|很棒|绿化好/;
 const clauses=t.split(/[，,。！!；;？?]/).filter(Boolean);
 const neg=negative.test(t);
 const pos=clauses.some(c=>!negative.test(c)&&!/(?:希望|期待|争取|做到|如果|要是|未来|将来).*?(?:满意|好|不错|棒)/.test(c)&&(positive.test(c)||c==='好'));
 if(neg&&pos)return '其他满意相关';
 if(neg)return '不满意表达';
 if(pos)return '正向评价';
 if(/满意|满竟|満意/.test(t))return '其他满意相关';
 return null;
}
function matchesSatisfaction(text){const kind=satisfactionTextKind(text);return satisfactionText==='全部'||(satisfactionText==='全部满意相关'?kind!==null:kind===satisfactionText);}
function satisfactionTextCounts(g){const result=Object.fromEntries(satisfactionKinds.map(k=>[k,0]));for(const [text,n] of g.comments){const kind=satisfactionTextKind(text);if(kind)result[kind]+=n;}return result;}
function comments(g){
 const texts=g.comments.filter(([t])=>(!textQuery||t.includes(textQuery))&&(topic==='全部'||D.rules[topic].some(w=>t.toLowerCase().includes(w)))&&matchesSatisfaction(t));
 const counts=satisfactionTextCounts(g),related=Object.values(counts).reduce((a,n)=>a+n,0),topicMax=Math.max(1,...Object.values(g.topics));
 return `<div class="section-top"><h2>Q13 · 开放意见 <span class="question-type">填空题</span></h2></div><div class="metrics"><div class="metric"><div class="label">Q13 · 空白 / 空标记</div><div class="value">${fmt(g.textEmpty)}</div></div><div class="metric"><div class="label">明确“无意见”等回答</div><div class="value">${fmt(g.textNo)}</div></div><div class="metric"><div class="label">其余文字回答</div><div class="value">${fmt(g.textOther)}</div><div class="caption">包括评价、建议及难分类文本</div></div><div class="metric"><div class="label">其余文字占当前样本</div><div class="value">${pct(g.textOther,g.n)}</div></div></div>
 <section class="panel" id="satisfactionTextPanel"><div class="section-top"><div><h2>答案与满意相关的部分</h2><p class="caption">在 Q13 原文中初筛到 ${related} 份满意相关回答，占其余文字回答的 ${pct(related,g.textOther)}。点击分类查看原文。</p></div><button data-satisfaction="全部满意相关" aria-controls="q13-originals" aria-pressed="${satisfactionText==='全部满意相关'}">全部满意相关 · ${related} 份</button></div>
 <div class="satisfaction-options">${satisfactionKinds.map(k=>`<button class="satisfaction-option" data-satisfaction="${k}" aria-controls="q13-originals" aria-pressed="${satisfactionText===k}"><span>${k}</span><strong>${counts[k]} 份</strong><span class="caption">查看原文</span></button>`).join('')}</div>
 <p class="caption">这是开放题文字的规则初筛，不是 Q10 满意率，也不代表受访者整体态度；带建议的正向评价仍保留完整原文。此处及主题计数只跟随顶部行政区、性别、年龄条件。</p>
 <details><summary>查看满意相关的初筛规则</summary><p class="caption">正向评价匹配“满意、很好、非常好、非常的好、挺好、蛮好、比较好、不错、好评、很棒、绿化好”及单独回答“好”。优先识别“不满意、不太满意、不够满意、不是很满意、谈不上满意、难以满意、无法满意、不满”等否定表达；同一句中表达希望、期待或假设的评价不直接算正向。正负表达并存、其他提及“满意”或疑似错字“满竟 / 満意”列为其他满意相关。规则可能漏判或误判，需结合原文复核；未命中不等于不满意。</p></details></section>
 <div class="grid"><section class="panel"><h2>意见主题的关键词初筛</h2><p class="caption">点击主题行查看对应原文。按 ${g.textOther} 份其余文字回答初筛；同一回答可命中多个主题，只表示关键词命中。</p>${Object.entries(g.topics).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="topicrow topic-button" data-topic="${k}" aria-controls="q13-originals" aria-pressed="${topic===k}"><span>${k}</span><span class="track" aria-hidden="true"><span class="fill" style="display:block;width:${100*n/topicMax}%"></span></span><span>${n} 份</span></button>`).join('')}<p class="caption">点击主题或满意分类，会清除原文区的其他筛选条件，展示该项完整命中结果；顶部三项筛选保持不变。</p><details><summary>查看关键词规则</summary>${Object.entries(D.rules).map(([k,v])=>`<p class="caption"><b>${k}</b>：${v.join('、')}</p>`).join('')}</details></section>
 <section class="panel"><h2>阅读说明</h2><p>本页采用关键词初筛、满意相关表达初筛及原文列表。相同文本合并显示，保留出现次数；未因此删除答卷。</p><p>剩余文字包括建议、笼统评价、错别字和难分类文本，不能全部视为有效建议。主题与满意相关表达可以重叠，例如“环境很好”既可能命中环境主题，也可能命中正向评价。</p><p class="caption">初筛规则不等于人工主题编码或情感分析。“无意见”未自动计为满意。下方可组合主题、满意表达和关键词，进一步回看语境。</p></section></div>
 <section class="panel" id="q13-originals"><div class="section-top"><div><h2>Q13 · 原文回看 <span class="question-type">填空题</span></h2><p class="caption" id="textResultCount" aria-live="polite">${texts.length} 种匹配文本，合计 ${texts.reduce((a,x)=>a+x[1],0)} 份回答；已去除空标记和明确“无意见”等回答。</p></div><button id="clearTextFilters">查看全部原文</button></div>
 <div class="split" style="margin-bottom:18px"><label class="field">主题<select id="topic"><option ${topic==='全部'?'selected':''}>全部</option>${Object.keys(D.rules).map(k=>`<option ${k===topic?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">满意相关表达<select id="satisfactionText">${['全部','全部满意相关',...satisfactionKinds].map(k=>`<option ${k===satisfactionText?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">关键词<input id="textSearch" value="${esc(textQuery)}" placeholder="查找意见原文"></label></div>
 <p class="caption">原文筛选：${esc(topic)} · ${esc(satisfactionText)}${textQuery?' · 关键词“'+esc(textQuery)+'”':''}</p>
 <ol class="textlist">${texts.slice(0,textLimit).map(([t,n])=>`<li>${esc(t)} <span class="count">× ${n}</span></li>`).join('')||'<li>没有匹配的文字回答。</li>'}</ol>${texts.length>textLimit?'<button id="more">再显示 30 条</button>':''}</section>`;
}
function jumpToOriginals(){const section=$('#q13-originals');if(section)section.scrollIntoView({behavior:'instant',block:'start'});const selector=$('#satisfactionText');if(selector)selector.focus({preventScroll:true});}
function selectTextGroup(kind,value){topic=kind==='topic'?value:'全部';satisfactionText=kind==='satisfaction'?value:'全部';textQuery='';textLimit=30;render();jumpToOriginals();}
function bindContent(){document.querySelectorAll('[data-district]').forEach(b=>b.onclick=()=>choose(b.dataset.district));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTextGroup('topic',b.dataset.topic));document.querySelectorAll('[data-satisfaction]').forEach(b=>b.onclick=()=>selectTextGroup('satisfaction',b.dataset.satisfaction));const p=$('#parkSearch');if(p)p.oninput=()=>{parkQuery=p.value;const pos=p.selectionStart;render();$('#parkSearch').focus();$('#parkSearch').setSelectionRange(pos,pos)};const t=$('#textSearch');if(t)t.oninput=()=>{textQuery=t.value;textLimit=30;const pos=t.selectionStart;render();$('#textSearch').focus();$('#textSearch').setSelectionRange(pos,pos)};if($('#topic'))$('#topic').onchange=e=>{topic=e.target.value;textLimit=30;render();$('#topic').focus({preventScroll:true})};if($('#satisfactionText'))$('#satisfactionText').onchange=e=>{satisfactionText=e.target.value;textLimit=30;render();$('#satisfactionText').focus({preventScroll:true})};if($('#clearTextFilters'))$('#clearTextFilters').onclick=()=>selectTextGroup('topic','全部');if($('#more'))$('#more').onclick=()=>{textLimit+=30;render()};}

function method(g){return `<section class="panel method"><h2>统计口径与数据检查</h2><ol><li><b>数据范围：</b>Excel 共 ${ALL.n} 条非空答卷记录，唯一序号 ${D.uniqueIds} 个，提交日期 ${D.dates.join(' 至 ')}。本次不追加删样、不替换原始文件，也未将“序号唯一”解释为“受访者一定唯一”。</li><li><b>参考报告：</b>PDF 的各封闭题有效答题人数为 4,474；本次按 Excel 的 3,810 条记录重新统计，比参考报告少 664 条。没有逐条匹配 PDF 原始答卷，不能将差异当作时间变化，也不能仅凭数量差确定删选原因。</li><li><b>行政区：</b>按 J 列“所属上海市行政区（明确）”分类，是填写公园的归属区，并非受访者居住区。14 个区有样本，青浦区、崇明区为零样本。K 列待核实名称非空 ${ALL.guessed} 条，未采用猜测名称自动合并或改区。</li><li><b>选择率：</b>选中该选项的人数 ÷ 本题非空有效答题人数。多选内容按“┋”拆分，单份答卷内同一选项只计一次；“其他:〖…〗”合并为“其他”。空白、(空)、（空）不作为有效作答。题目原有“未见过/使用过”“暂无新增需求”是有效选项。</li><li><b>矛盾选择：</b>同时选择否定项和其他项的答卷保留原答，各选项照实计数。因此不能直接用 100% 减去否定项选择率推算实际使用率或新增需求人数。</li><li><b>满意度：</b>满意率 =（非常满意 + 满意）÷ Q10 有效人数；非常不满意、不满意、一般、满意、非常满意分别赋 1–5 分，均分是此赋分假设下的描述性指标，不代表量表等距性已验证。</li><li><b>公园名称：</b>Q3 只去除首尾空格，保留原文本统计；名称变体未合并，表中项目数不是实际公园数。</li><li><b>开放意见：</b>去除空值后，将明确无意见类文本单列；去空格及常见标点后匹配以下词表：${D.noWords.join('、')}。剩余文本均保留，按关键词作初筛，另对满意相关表达进行透明规则初筛，分类及规则见 Q13；均非人工定性编码，不作受访者整体态度或因果判断。</li><li><b>解释边界：</b>非均衡区域样本，抽样框、入选概率及筛选规则未提供；未加权、未做总体外推或显著性检验。各区百分比差异仅为样本描述。图中全部样本基准固定为原始 3,810 份答卷，不随筛选改变。顶部三个条件按交集组合筛选；行政区分布及行政区对比保留性别、年龄条件，展示所有区，点击“全部行政区”仅清除行政区条件。</li><li><b>离线与导出：</b>所有计算和筛选均在本地浏览器完成，不需要联网。CSV 导出包含当前行政区、性别与年龄组合下的各题统计、公园名称分布和开放题概况；浏览器“打印 / 保存 PDF”输出当前页签。</li></ol><h3>当前范围各题作答检查</h3><div class="tablewrap"><table><thead><tr><th>题目</th><th class="num">有效人数</th><th class="num">缺失人数</th><th class="num">否定项与其他项并选</th></tr></thead><tbody>${Object.keys(g.q).map(q=>`<tr><td>${esc(D.titles[q])}</td><td class="num">${Q(g,q).n}</td><td class="num">${g.n-Q(g,q).n}</td><td class="num">${Q(g,q).conflict}</td></tr>`).join('')}</tbody></table></div></section>`;}
function render(){const g=selectedGroup();$('#status').textContent=`当前范围：${filterLabel()} · ${fmt(g.n)} 份答卷${tab==='compare'?'；本页按性别、年龄对比全部行政区':''}`;$('#status').style.marginBottom='15px';$('#content').setAttribute('aria-labelledby','tab-'+tab);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));$('#content').innerHTML=!g.n&&!['overview','method','compare'].includes(tab)?`<section class="panel empty"><h2>当前筛选组合暂无样本</h2><p>${esc(filterLabel())} 没有匹配答卷，无法计算比例。可调整顶部条件；选择“全部性别”“全部年龄”可取消相应限制。</p></section>`:({overview,age:ageView,gender:genderView,parks,facilities,satisfaction,needs,comments,compare,method}[tab])(g);bindContent();}
function choose(v){district=v;$('#district').value=v;parkQuery='';textQuery='';textLimit=30;render();}

function exportCSV(){const g=selectedGroup(),rows=[['范围',filterLabel()],['行政区',district==='全部样本'?'全部行政区':district],['性别',sex],['年龄',age],['样本数',g.n],['来源','游客0928_筛选过.xlsx'],['注','多选百分比以题目有效答题人数为分母；矛盾选项保留；公园名称未合并；未加权'],[],['题号','题型','题目','选项','人数','有效答题人数','百分比','缺失人数','矛盾作答份数']];for(const q of Object.keys(g.q)){if(+q===4){const valid=g.parks.reduce((sum,x)=>sum+x[1],0);for(const [k,n] of g.parks)rows.push([3,questionType(3),'您最常去的（或正在游览的）公园是？',k,n,valid,valid?(100*n/valid).toFixed(4):'',g.n-valid,'']);}for(const k of keys(+q))rows.push([q,questionType(q),D.titles[q],k,count(g,q,k),Q(g,q).n,Q(g,q).n?(100*count(g,q,k)/Q(g,q).n).toFixed(4):'',g.n-Q(g,q).n,Q(g,q).conflict]);}rows.push([],['Q13 填空题文本概况','份数'],['空白/空标记',g.textEmpty],['明确无意见',g.textNo],['其余文字',g.textOther],[],['Q13 关键词主题','命中份数','其余文字份数']);for(const [k,n] of Object.entries(g.topics))rows.push([k,n,g.textOther]);rows.push([],['Q13 满意相关表达初筛','份数','其余文字份数']);for(const [k,n] of Object.entries(satisfactionTextCounts(g)))rows.push([k,n,g.textOther]);const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replaceAll('"','""')+'"';const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='智慧公园统计_'+[district,sex,age].join('_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#dateRange').textContent=D.dates.join(' — ');$('#district').innerHTML=Object.entries(D.groups).map(([k,g])=>`<option value="${k}">${k==='全部样本'?'全部行政区':k}</option>`).join('');$('#district').onchange=e=>choose(e.target.value);$('#sex').innerHTML=['全部性别',...D.sexes].map(k=>`<option>${k}</option>`).join('');$('#age').innerHTML=['全部年龄',...D.ages].map(k=>`<option>${k}</option>`).join('');$('#sex').onchange=e=>{sex=e.target.value;textLimit=30;render()};$('#age').onchange=e=>{age=e.target.value;textLimit=30;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#export').onclick=exportCSV;$('#print').onclick=()=>window.print();render();
</script></body></html>
